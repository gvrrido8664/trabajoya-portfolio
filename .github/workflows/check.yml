name: API offline checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python demo_check.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
      - run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          cp .env.example .env.development
          cp .env.example .env.production
          flutter pub get
          flutter analyze
          flutter test
          flutter build web
        working-directory: frontend
