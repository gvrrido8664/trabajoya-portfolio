name: trabajoya_app
description: "TrabajoYa — Marketplace de servicios en Chile"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  http_parser: ^4.0.0
  provider: ^6.1.0
  go_router: ^17.3.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.0
  geolocator: ^14.0.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  web: ^1.1.1
  flutter_dotenv: ^6.0.1
  app_links: ^7.2.1
  sentry_flutter: ^8.14.2

  google_fonts: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/brand/
    - assets/fonts/
    - .env.development
    - .env.production

  fonts:
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay[wght].ttf
          weight: 400
        - asset: assets/fonts/BigShouldersDisplay[wght].ttf
          weight: 700
        - asset: assets/fonts/BigShouldersDisplay[wght].ttf
          weight: 900
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo[wdth,wght].ttf
          weight: 400
        - asset: assets/fonts/Archivo[wdth,wght].ttf
          weight: 600
        - asset: assets/fonts/Archivo[wdth,wght].ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
