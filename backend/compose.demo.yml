services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: trabajoya_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - demo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d trabajoya_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://demo:demo@db:5432/trabajoya_demo
      DB_REQUIRE_SSL: "false"
      DEBUG: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo_db:
